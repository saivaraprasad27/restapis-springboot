spring.application.name=DecProjectModule
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:jan_product}
spring.datasource.username=${MYSQL_USER:dev}
spring.datasource.password=${MYSQL_PASSWORD:dev123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Stripe (never hardcode secrets; provide STRIPE_SECRET_KEY via environment)
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.success.url=${STRIPE_SUCCESS_URL:https://unifyapps.com/}

logging.level.root=warn
